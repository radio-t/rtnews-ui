<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<meta name="viewport" content="width=device-width" />
		<meta name="viewport" content="initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.gstatic.com" />
		<link rel="preconnect" href="<%= htmlWebpackPlugin.options.APIROOT %>" />
		<title>Новости для Радио-Т</title>

		<link
			rel="alternate"
			type="application/rss+xml"
			title="Новости для Радио-Т"
			href="/rss"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" />
	</head>
	<body>
		<div class="app">
			<div class="page">
				<header class="header page__header">
					<div class="header__top">
						<h1 class="title header__title">
							Новости для <span class="no-break">Радио-Т</span>
						</h1>
					</div>
					<div class="header__bar">
						<nav class="header__tabs" aria-label="Main navigation">
							<a class="header__tab active" aria-current="page" href="/"
								>Все темы</a
							>
							<a class="header__tab" href="/archive/">Архив</a>
						</nav>
					</div>
				</header>
				<div class="content page__content">
					<div class="loading">
						Загружаю<span class="loading__dots">...</span>
					</div>
				</div>
				<div class="footer page__footer">
					<hr />
					<a href="http://radio-t.com/">Radio-T</a>, 2018
				</div>
				<div class="notifications"></div>
			</div>
		</div>

</html>
